# SELFEVOLVE Configuration
# Active LLM: local HuggingFace Transformers (Gemma-2). Other providers are kept as comments.

system:
  name: "SELFEVOLVE"
  version: "1.0.0"
  domain: "travel_planning"

planner:
  type: "HTN"
  max_depth: 5
  timeout_ms: 300

executor:
  max_retries: 2
  timeout_seconds: 30
  enable_verification: true

metacognition:
  tau_u: 0.25          # uncertainty threshold for S1/S2 arbitration
  tau_p: 0.20          # violation probability threshold
  budget_ms: 2000
  enable_reflection: true

fdka:
  enabled: true

  scoring_weights:
    plausibility: 0.35
    consistency: 0.35
    utility: 0.20
    risk: 0.10

  threshold: 0.48       # acceptance gate threshold (score >= threshold)

  propose_edit:
    # Provider options: "transformers", "openai", "deepseek", "mock"
    llm_provider: "transformers"

    # ✅ Active local model
    model: "google/gemma-2-9b-it"

    # Generation knobs (note: in this repo max_tokens maps to max_new_tokens)
    temperature: 0.3
    max_tokens: 512
    timeout_sec: 60.0
    max_retries: 2

    # HF runtime hints (safe to keep; some may be ignored by current runner)
    device_map: "auto"          # "auto" / "cuda:0" / "cpu"
    dtype: "auto"               # "auto" / "fp16" / "bf16" / "fp32"
    use_flash_attention: false  # enable only if your stack supports it
    trust_remote_code: false
    max_input_tokens: 6000

    # Prompt template (may be unused depending on the runner implementation)
    # prompt_template: "gemma-it"

    # ---- Alternative providers (keep commented; activate by changing llm_provider) ----
    # OpenAI:
    # llm_provider: "openai"
    # model: "gpt-4o-mini"

    # DeepSeek (OpenAI-compatible endpoint):
    # llm_provider: "deepseek"
    # model: "deepseek-chat"
    # base_url: "https://api.deepseek.com"

    # Mock (offline deterministic testing):
    # llm_provider: "mock"
    # model: "mock"

  consistency:
    use_z3: false

  utility:
    k_similar_traces: 20

  risk:
    eta: 0.2

  budget:
    beta_edge: 5
    beta_step: 10
    beta_tok: 1000

governance:
  provenance:
    enable: true
    log_path: "data/logs/provenance.jsonl"

  trust:
    alpha: 2
    beta: 1

  gates:
    tau_impact: 0.6
    tau_conf: 0.5

  canary:
    num_tests: 8
    statistical_max_fail_rate: 0.1
    heuristic_risk_threshold: 0.6

  rollback:
    enable: true

knowledge:
  process_kg_path: "data/knowledge/process_kg.json"
  rule_pool_path: "data/knowledge/operators.json"

scenario:
  name: "travel_planning"
  difficulty: "hard"
  num_tasks: 20
  failure_rate: 0.4
  min_failures_in_prefix: 5
  prefix_len: 10
  failure_injector_seed: 42
  task_generation_seed: 7

evaluation:
  baselines: ["static_nesy", "llm_reflect", "verify_only"]
  ablations: ["no_governance", "no_verify", "no_arbitration", "no_fdka"]

experiment:
  agent_to_run: "selfevolve"

demo:
  num_tasks: 20
  failure_rate: 0.4
  min_failures_in_prefix: 5

output:
  results_dir: "data/results"
  plots_dir: "data/results/plots"

logging:
  level: "INFO"
  log_file: "data/logs/selfevolve.log"
