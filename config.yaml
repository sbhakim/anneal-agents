# ANNEAL Comprehensive Configuration
# ============================================================================
# This is the unified configuration file with all LLM providers and scenarios
# Uncomment the provider/scenario you want to use
# ============================================================================

system:
  name: "ANNEAL"
  version: "1.0.0"
  # IMPORTANT: Keep domain in sync with scenario.name below.
  # travel run  → domain: "travel_planning"
  # ecommerce   → domain: "ecommerce"
  # itsm        → domain: "itsm"
  domain: "ecommerce"

planner:
  type: "HTN"
  max_depth: 5
  timeout_ms: 300

executor:
  # Baseline retries are part of the runtime behavior; keep stable when comparing adaptation runs.
  max_retries: 2
  timeout_seconds: 30
  enable_verification: true
  # Minimal: make repeated recoveries observable and eligible for FDKA trigger.
  enable_repair: true
  repair_hops: 2
  recovered_failure_alert_threshold: 2

metacognition:
  tau_u: 0.25          # uncertainty threshold for S1/S2 arbitration
  tau_p: 0.20          # violation probability threshold
  budget_ms: 2000
  enable_reflection: true

fdka:
  enabled: true

  scoring_weights:
    plausibility: 0.40  # increased from 0.35 (trust LLM proposals more)
    consistency: 0.25   # reduced from 0.35 (reduce SAT solver veto power)
    utility: 0.25       # increased from 0.20 (weight empirical success higher)
    risk: 0.10          # unchanged (maintain safety threshold)

  threshold: 0.18       # patch accept if aggregate >= threshold (lowered for defensibility - allows more patches)

  propose_edit:
    # =========================================================================
    # LLM PROVIDER CONFIGURATION
    # =========================================================================
    # Choose ONE provider by uncommenting the corresponding section below
    # Available providers: "transformers", "openai", "deepseek", "mock"
    # =========================================================================

    # -------------------------------------------------------------------------
    # OPTION 1: Local Transformers (Offline/HuggingFace models)
    # -------------------------------------------------------------------------
    # Best for: Privacy, no API costs, offline operation
    # Requirements: GPU with 16GB+ VRAM, transformers, torch installed
    # Cost: Free (hardware only)
    # -------------------------------------------------------------------------
    # llm_provider: "transformers"
    # model: "google/gemma-2-9b-it"              # Recommended: Best quality/speed
    # # Alternatives:
    # # model: "mistralai/Mistral-7B-Instruct-v0.2"  # Good quality, faster
    # # model: "meta-llama/Llama-3.1-8B-Instruct"    # High quality, slower
    # # model: "Qwen/Qwen2.5-7B-Instruct"            # Good multilingual
    # # model: "microsoft/Phi-3-mini-128k-instruct"  # Lightweight, long context
    # # model: "tiiuae/falcon-7b-instruct"           # Alternative option
    # # Local path (pre-downloaded weights):
    # # model: "/models/gemma-2-9b-it"

    # -------------------------------------------------------------------------
    # OPTION 2: OpenAI API (GPT-4o-mini)
    # -------------------------------------------------------------------------
    # Best for: Highest patch quality, production deployments
    # Requirements: OPENAI_API_KEY environment variable
    # Cost: ~$0.02 per run (10× more than DeepSeek)
    # Quality: Best error mapping, recommended after FDKA infrastructure fixes
    # -------------------------------------------------------------------------
    llm_provider: "openai"
    model: "gpt-4o-mini"
    # # Alternative OpenAI models:
    # # model: "gpt-4o"           # Highest quality, most expensive
    # # model: "gpt-3.5-turbo"    # Cheaper, lower quality

    # -------------------------------------------------------------------------
    # OPTION 3: DeepSeek API (Cost-effective)
    # -------------------------------------------------------------------------
    # Best for: Cost-effective operation, similar quality to OpenAI with fixes
    # Requirements: DEEPSEEK_API_KEY environment variable
    # Cost: ~$0.002 per run (cheapest)
    # Quality: NOW sufficient with fixed error capture (same as GPT-4o-mini)
    # -------------------------------------------------------------------------
    # llm_provider: "deepseek"
    # model: "deepseek-chat"
    # base_url: "https://api.deepseek.com"

    # -------------------------------------------------------------------------
    # OPTION 4: Mock Provider (Testing only)
    # -------------------------------------------------------------------------
    # Best for: Testing, CI/CD, debugging without API calls
    # Requirements: None
    # Cost: Free
    # Quality: Template-based, deterministic (no real LLM)
    # -------------------------------------------------------------------------
    # llm_provider: "mock"
    # model: "mock"

    # -------------------------------------------------------------------------
    # Common Generation Parameters (all providers)
    # -------------------------------------------------------------------------
    temperature: 0.3
    max_tokens: 512
    timeout_sec: 60.0
    max_retries: 2

    # -------------------------------------------------------------------------
    # Transformers-specific parameters (ignored by other providers)
    # -------------------------------------------------------------------------
    device_map: "auto"          # "auto" / "cuda:0" / "cpu"
    dtype: "auto"               # "auto" / "fp16" / "bf16" / "fp32"
    use_flash_attention: false
    trust_remote_code: false
    max_input_tokens: 6000

  consistency:
    # Enable minimal SMT check in src/fdka/scoring.py (requires `pip install z3-solver`).
    use_z3: true

  utility:
    k_similar_traces: 20

  risk:
    eta: 0.2

  budget:
    beta_edge: 5
    beta_step: 10
    beta_tok: 1000

governance:
  provenance:
    enable: true
    log_path: "data/logs/provenance.jsonl"

  trust:
    alpha: 2
    beta: 1

  gates:
    tau_impact: 0.6
    tau_conf: 0.5
    # Minimal: promote solver UNSAT to a hard veto when scorer provides verdict.
    use_z3: true
    z3_min_coverage: 0.2  # require non-trivial extraction before hard veto
    z3_unknown_policy: "allow"  # UNKNOWN never vetoes; canary remains empirical gate

  canary:
    # Canary uses either retrieved examples and/or a deterministic suite (when wired).
    # num_tests is the intended cap for canary simulation passes.
    num_tests: 8
    statistical_max_fail_rate: 0.1
    heuristic_risk_threshold: 0.6

  rollback:
    enable: true

knowledge:
  process_kg_path: "data/knowledge/process_kg.json"
  rule_pool_path: "data/knowledge/operators.json"

# =============================================================================
# SCENARIO CONFIGURATION
# =============================================================================
# Choose scenario by changing the "name" field
# Available scenarios: "travel_planning", "ecommerce", "travel_stochastic"
# =============================================================================
scenario:
  # =========================================================================
  # HOW TO SWITCH SCENARIOS
  # Step 1: Uncomment the name + difficulty for the scenario you want.
  # Step 2: Comment out the other name lines.
  # Step 3: Also change system.domain (top of file) to match.
  # Run:  conda run -n hysym python main.py --config config.yaml --mode eval
  # =========================================================================

  # -------------------------------------------------------------------------
  # OPTION 1: Travel Planning (Original domain — CURRENTLY ACTIVE)
  # system.domain must be: "travel_planning"
  # -------------------------------------------------------------------------
  # name: "travel_planning"
  # difficulty: "hard"

  # -------------------------------------------------------------------------
  # OPTION 2: E-commerce (Cross-domain validation) — CURRENTLY ACTIVE
  # To activate: comment out Option 1 name/difficulty, uncomment below.
  # system.domain must be: "ecommerce"
  # New: tool_schema_drift injected for PlaceOrder → triggers FDKA patch
  # -------------------------------------------------------------------------
  name: "ecommerce"
  difficulty: "normal"

  # -------------------------------------------------------------------------
  # OPTION 3: Stochastic Travel (Metacognition stress test)
  # system.domain must be: "travel_planning"
  # -------------------------------------------------------------------------
  # name: "travel_stochastic"
  # difficulty: "hard"
  # noise:
  #   seed: 99
  #   transient_failure_rate: 0.05
  #   uncertainty_injection: 0.25
  #   dynamic_policy_shifts: 0.30
  #   resource_contention: 0.05

  # -------------------------------------------------------------------------
  # OPTION 4: IT Service Management (Third-domain cross-domain validation)
  # system.domain must be: "itsm"
  # Constraint guardrails now active: priority_escalation_denied is vetoed
  # Patchable: approval_required, change_window, mfa, api_schema_deprecated
  # Seeds: task_generation_seed=31, failure_injector_seed=53
  # -------------------------------------------------------------------------
  # name: "itsm"
  # difficulty: "hard"

  # -------------------------------------------------------------------------
  # Common Scenario Parameters
  # -------------------------------------------------------------------------
  # Task generation + failure injection controls (keep stable for comparisons)
  num_tasks: 25
  failure_rate: 0.7    # increased to 0.7 (70% failures) for maximum FDKA triggering
  min_failures_in_prefix: 5  # lowered to 5 for earlier adaptation window
  prefix_len: 10
  failure_injector_seed: 42
  task_generation_seed: 7

evaluation:
  baselines: ["static_nesy", "llm_reflect", "verify_only", "react", "reflexion"]
  ablations: ["no_governance", "no_verify", "no_arbitration", "no_fdka"]
  domains: ["travel_planning", "ecommerce", "itsm"]

experiment:
  agent_to_run: "anneal"

demo:
  # Demo mode parameters; keep aligned with scenario unless intentionally diverging.
  num_tasks: 25
  failure_rate: 0.4
  min_failures_in_prefix: 5

output:
  results_dir: "data/results"
  plots_dir: "data/results/plots"

logging:
  level: "INFO"
  log_file: "data/logs/anneal.log"

# =============================================================================
# QUICK START GUIDE
# =============================================================================
# 1. Choose your LLM provider (lines 47-110):
#    - For best quality: OpenAI GPT-4o-mini (requires API key)
#    - For cost-effective: DeepSeek (requires API key, ~100× cheaper)
#    - For offline: Transformers with local models
#    - For testing: Mock provider
#
# 2. Choose your scenario (lines 171-195):
#    - travel_planning: Original domain
#    - ecommerce: Cross-domain validation
#    - travel_stochastic: Metacognition stress test
#
# 3. Set environment variables (if using remote providers):
#    export OPENAI_API_KEY="sk-..."       # for OpenAI
#    export DEEPSEEK_API_KEY="sk-..."    # for DeepSeek
#
# 4. Run evaluation:
#    python main.py --config config.yaml --mode eval
#
# =============================================================================
