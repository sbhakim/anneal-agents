# SELFEVOLVE Configuration File
# Based on paper: "A Self-Evolving Neuro-symbolic Architecture for Open-World Instructability"

# System-wide settings
system:
  name: "SELFEVOLVE"
  version: "1.0.0"
  domain: "travel_planning"

# Planner settings (HTN compiler)
planner:
  type: "HTN"
  max_depth: 5
  timeout_ms: 100

# Executor settings
executor:
  max_retries: 2
  timeout_seconds: 30
  enable_verification: true

# Metacognitive control (Section VII)
metacognition:
  tau_u: 0.5  # Uncertainty threshold for S1/S2 arbitration
  tau_p: 0.3  # Violation probability threshold
  budget_ms: 2000 # Budget for regulation
  enable_reflection: true

# FDKA Pipeline (Section VIII)
fdka:
  scoring_weights:
    plausibility: 0.35
    consistency: 0.35
    utility: 0.20
    risk: 0.10
  threshold: 0.48

  # ✅ MAIN PROVIDER SELECTION
  # Options: "openai", "deepseek", "transformers", "mock"
  propose_edit:
    llm_provider: "deepseek"  # ✅ Change this to switch providers

    # ✅ FLAT STRUCTURE: Model settings at same level
    model: "deepseek-chat"    # Used if llm_provider="openai"
    temperature: 0.3
    max_tokens: 2000
    timeout_sec: 60.0
    max_retries: 4

    # ✅ Optional: Override base_url for custom endpoints
    # base_url: "https://api.openai.com/v1"  # Uncomment if needed

  # ✅ Alternative provider configs (activate by changing llm_provider above)
  # When using DeepSeek, change llm_provider to "deepseek" and set:
  # model: "deepseek-chat"
  # base_url: "https://api.deepseek.com"

  # When using local Transformers, change llm_provider to "transformers" and set:
  # model: "mistralai/Mistral-7B-Instruct-v0.3"
  # Or use one of: google/gemma-2-9b, meta-llama/Llama-3.1-8B, Qwen/Qwen2.5-7B-Instruct

  consistency:
    use_z3: false
  utility:
    k_similar_traces: 20
  risk:
    eta: 0.2
  budget:
    beta_edge: 5
    beta_step: 10
    beta_tok: 1000

# Governance (Section IX)
governance:
  provenance:
    enable: true
    log_path: "data/logs/provenance.jsonl"
  trust:
    alpha: 2
    beta: 1
  gates:
    tau_impact: 0.6
    tau_conf: 0.5
  canary:
    num_tests: 8
    statistical_max_fail_rate: 0.1
    heuristic_risk_threshold: 0.6
  rollback:
    enable: true

# Knowledge Graphs
knowledge:
  process_kg_path: "data/knowledge/process_kg.json"
  rule_pool_path: "data/knowledge/operators.json"

# Scenarios
scenario:
  name: "travel_planning"
  difficulty: "normal"  # Options: easy, normal, hard, adversarial
  num_tasks: 50
  failure_rate: 0.4
  min_failures_in_prefix: 5
  prefix_len: 10
  failure_injector_seed: 42
  task_generation_seed: 7

# Evaluation settings
evaluation:
  baselines: ["static_nesy", "llm_reflect", "verify_only"]
  ablations: ["no_governance", "no_verify", "no_arbitration", "no_fdka"]

# Experiment Control
experiment:
  agent_to_run: "selfevolve"

# Demo-specific overrides
demo:
  num_tasks: 20
  failure_rate: 0.4
  min_failures_in_prefix: 5

# Output settings
output:
  results_dir: "data/results"
  plots_dir: "data/results/plots"

# Logging
logging:
  level: "INFO"
  log_file: "data/logs/selfevolve.log"