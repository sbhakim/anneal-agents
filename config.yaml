# SELFEVOLVE Configuration
# Domain: travel_planning
# Notes:
# - This file is intentionally verbose for reproducibility and reviewer traceability.
# - Seeds and failure injection controls are pinned to make before/after comparisons fair.
# - LLM provider blocks include local/offline Transformer options plus remote providers for parity.
# - Some HF runtime keys may be ignored depending on the repo runner implementation.

system:
  name: "SELFEVOLVE"
  version: "1.0.0"
  domain: "travel_planning"

planner:
  type: "HTN"
  max_depth: 5
  timeout_ms: 300

executor:
  # Baseline retries are part of the runtime behavior; keep stable when comparing adaptation runs.
  max_retries: 2
  timeout_seconds: 30
  enable_verification: true
  # Minimal: make repeated recoveries observable and eligible for FDKA trigger.
  enable_repair: true
  repair_hops: 2
  recovered_failure_alert_threshold: 2

metacognition:
  tau_u: 0.25          # uncertainty threshold for S1/S2 arbitration
  tau_p: 0.20          # violation probability threshold
  budget_ms: 2000
  enable_reflection: true

fdka:
  enabled: true

  scoring_weights:
    plausibility: 0.35
    consistency: 0.35
    utility: 0.20
    risk: 0.10

  threshold: 0.48       # patch accept if aggregate >= threshold

  propose_edit:
    # Provider options: "transformers", "openai", "deepseek", "mock"
    # llm_provider: "transformers"

    # -------------------------------------------------------------------------
    # Local / offline Transformers (HF) model selection
    # -------------------------------------------------------------------------
    # Active local model (Gemma-2 Instruct).
    # model: "google/gemma-2-9b-it"

    # Other local/offline options (uncomment + set model accordingly):
    # model: "mistralai/Mistral-7B-Instruct-v0.2"
    # model: "meta-llama/Llama-3.1-8B-Instruct"
    # model: "Qwen/Qwen2.5-7B-Instruct"
    # model: "microsoft/Phi-3-mini-128k-instruct"
    # model: "tiiuae/falcon-7b-instruct"
    #
    # Local path example (pre-downloaded weights):
    # model: "/models/gemma-2-9b-it"

    # Generation knobs (repo: max_tokens maps to max_new_tokens)
    temperature: 0.3
    max_tokens: 512
    timeout_sec: 60.0
    max_retries: 2

    # HF runtime hints (runner may ignore some keys)
    device_map: "auto"          # "auto" / "cuda:0" / "cpu"
    dtype: "auto"               # "auto" / "fp16" / "bf16" / "fp32"
    use_flash_attention: false
    trust_remote_code: false
    max_input_tokens: 6000

    # -------------------------------------------------------------------------
    # Remote providers (kept for parity / ablations; switch llm_provider to use)
    # -------------------------------------------------------------------------
    # OpenAI:
    # llm_provider: "openai"
    # model: "gpt-4o-mini"

    # DeepSeek (OpenAI-compatible endpoint):
    llm_provider: "deepseek"
    model: "deepseek-chat"
    base_url: "https://api.deepseek.com"

    # Mock (offline deterministic testing):
    # llm_provider: "mock"
    # model: "mock"

  consistency:
    # Enable minimal SMT check in src/fdka/scoring.py (requires `pip install z3-solver`).
    use_z3: true

  utility:
    k_similar_traces: 20

  risk:
    eta: 0.2

  budget:
    beta_edge: 5
    beta_step: 10
    beta_tok: 1000

governance:
  provenance:
    enable: true
    log_path: "data/logs/provenance.jsonl"

  trust:
    alpha: 2
    beta: 1

  gates:
    tau_impact: 0.6
    tau_conf: 0.5
    # Minimal: promote solver UNSAT to a hard veto when scorer provides verdict.
    use_z3: true
    z3_min_coverage: 0.2  # require non-trivial extraction before hard veto
    z3_unknown_policy: "allow"  # UNKNOWN never vetoes; canary remains empirical gate

  canary:
    # Canary uses either retrieved examples and/or a deterministic suite (when wired).
    # num_tests is the intended cap for canary simulation passes.
    num_tests: 8
    statistical_max_fail_rate: 0.1
    heuristic_risk_threshold: 0.6

  rollback:
    enable: true

knowledge:
  process_kg_path: "data/knowledge/process_kg.json"
  rule_pool_path: "data/knowledge/operators.json"

scenario:
  name: "travel_planning"
  difficulty: "hard"

  # Task generation + failure injection controls (keep stable for comparisons)
  num_tasks: 25
  failure_rate: 0.4
  min_failures_in_prefix: 5
  prefix_len: 10
  failure_injector_seed: 42
  task_generation_seed: 7

evaluation:
  baselines: ["static_nesy", "llm_reflect", "verify_only"]
  ablations: ["no_governance", "no_verify", "no_arbitration", "no_fdka"]

experiment:
  agent_to_run: "selfevolve"

demo:
  # Demo mode parameters; keep aligned with scenario unless intentionally diverging.
  num_tasks: 25
  failure_rate: 0.4
  min_failures_in_prefix: 5

output:
  results_dir: "data/results"
  plots_dir: "data/results/plots"

logging:
  level: "INFO"
  log_file: "data/logs/selfevolve.log"
